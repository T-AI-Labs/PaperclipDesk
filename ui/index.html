<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>PaperclipDesk</title>
    <style>
      /* Visible until React renders; matches LoadingPanel.tsx. */
      .boot { position: fixed; inset: 0; display: grid; place-items: center; font-family: 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif; background: #fff; color: #0a0a0a; }
      .boot-box { display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
      .boot-logo { width: 56px; height: 56px; }
      .boot-spin { display: inline-block; width: 12px; height: 12px; margin-right: 8px; vertical-align: -1px; border-radius: 50%; border: 2px solid currentColor; border-top-color: transparent; animation: boot-spin 0.9s linear infinite; }
      .boot-title { font-size: 18px; font-weight: 600; margin: 0; }
      .boot-detail { font-size: 14px; color: #737373; margin: 4px 0 0; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: dark) {
        .boot { background: #0a0a0a; color: #fafafa; }
        .boot-detail { color: #a1a1a1; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <div class="boot-box">
          <img class="boot-logo" src="/favicon.svg" alt="" />
          <div>
            <p class="boot-title">PaperclipDesk startet …</p>
            <p class="boot-detail"><span class="boot-spin"></span>Oberfläche wird geladen</p>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
