version: 2
updates:
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    groups:
      react:
        patterns: ['react*', '@types/react*']
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      tauri:
        patterns: ['tauri*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
