[package]
name = "paperclipdesk"
version = "1.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
sys-locale = "0.3"
tauri = { version = "=2.11.6", features = ["webview-data-url", "devtools", "unstable"] }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-updater = "2"
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
ureq = { version = "=3.4.2", features = ["json", "platform-verifier"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
serde_json.workspace = true
tauri-build = { workspace = true }
